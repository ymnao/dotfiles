# backlog / 配分の観測設定 (/dev step 1b と /next step 6 が参照するオプトインファイル)
# 書式: KEY=VALUE の 1 行ずつ。# 始まりはコメント。未設定の KEY はその機能を無効にする。
#
# INWARD_RATIO_MAX: 直近 20 件の merged PR に占める「内向き」(claude/ codex/
#   tests/ docs/ .github/ のみを触る PR) の許容比率。超えたら /next は次サイクルの
#   候補として外向き (fish/ nvim/ 等、日常的に使う設定の改善) を既定で提示する。
#   これが本体の指標 — repo の目的側が進んでいるかを直接見ている。
#   0.5 にしているのは、基盤整備を止める必要は無いが、半分は目的側に使いたいため。
INWARD_RATIO_MAX=0.5
#
# BACKLOG_CAP: open issue の警戒水位。**ゲートではなく煙探知機**。超過しても
#   作業は止めない。超過は「/pr の起票ゲート (実害 1 文 + 目的接続 1 文 +
#   Tier3 は記録しない) が機能していない」というサインとして読む。
#   20 は 2026-07-27 の棚卸し直後の open が 7 件だったことに対する余裕水位。
BACKLOG_CAP=20
