# backlog gate 設定 (/dev step 1a と /next step 6 が参照するオプトインファイル)
# 書式: KEY=VALUE の 1 行ずつ。# 始まりはコメント。未設定の KEY はその機能を無効にする。
#
# BACKLOG_CAP: open issue の上限。超過したら /dev は着手前に棚卸しを提案する
#   (自動 close はしない)。20 にしているのは、2026-07 時点で open 28 件・
#   そのうち 26 件がレビュー由来の内向きタスクだったため。1 サイクルで消化
#   できる規模に在庫を戻す狙い。
BACKLOG_CAP=20
#
# INWARD_STREAK_MAX: 内向き (skill / eval / hook / test / CI / 設定) サイクルの
#   連続上限。超えたら /dev が外向きタスク (日常的に使う shell・ツール設定の
#   改善) の候補も併せて提示する。強制はしない。
INWARD_STREAK_MAX=2
