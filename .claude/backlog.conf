# backlog の観測設定 (/dev step 1a と /next step 6 が参照するオプトインファイル)
# 書式: KEY=VALUE の 1 行ずつ。# 始まりはコメント。未設定の KEY はその機能を無効にする。
#
# 削除した設定: INWARD_RATIO_MAX (内向き PR の許容比率)。2026-08-01 に廃止。
#   内向きはレビューが finding を生むので在庫が積み上がるが、外向き (日常設定) は
#   摩擦を踏んだ瞬間にしか見つからず前もって棚卸しできない。供給機構の違うものを
#   比率で数えていたため、**解消手段の無い超過を 3 サイクル連続で報告し続けた**。
#   到達できない停止条件は「いつも赤いから見ない」指標になる。
#   後継として /next step 6 に「摩擦の取りこぼしを user に聞く」1 行を置いたが、
#   これも 2026-08-09 に廃止した (毎サイクル聞いて起票 0 件、user から
#   「毎回聞かれて面倒」と指摘)。**定期的に取りこぼしを監視する機構は 2 世代とも
#   廃止された** — 摩擦は踏んだ瞬間にしか具体化せず、その場で /dev <自由文> に
#   持ち込む経路が既にある (CLAUDE.md 目的節)。**3 世代目を作らないこと** —
#   比率・頻度・閾値のどれを使っても同じ結果になる。
#
# BACKLOG_CAP: open issue の警戒水位。**ゲートではなく煙探知機**。超過しても
#   作業は止めない。超過は「/pr の起票ゲート (実害 1 文 + 目的接続 1 文 +
#   Tier3 は記録しない) が機能していない」というサインとして読む。
#   20 は 2026-07-27 の棚卸し直後の open が 7 件だったことに対する余裕水位。
BACKLOG_CAP=20
