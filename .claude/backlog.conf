# backlog の観測設定 (/dev step 1b と /next step 6 が参照するオプトインファイル)
# 書式: KEY=VALUE の 1 行ずつ。# 始まりはコメント。未設定の KEY はその機能を無効にする。
#
# 削除した設定: INWARD_RATIO_MAX (内向き PR の許容比率)。2026-08-01 に廃止した。
#   内向きと外向きでは**タスクの発見機構が違う** — 内向きはレビューが finding を
#   生むので作業するほど在庫が積み上がるが、外向き (fish/ nvim/ 等の日常設定) は
#   使っていて摩擦を踏んだ瞬間にしか見つからず、前もって棚卸しできる性質のものでは
#   ない。この比率は供給機構の違うものを同じ土俵で数えており、外向きの在庫が
#   無い間は**解消手段の無い超過を毎サイクル報告し続けた** (3 サイクル連続)。
#   到達できない停止条件は「いつも赤いから見ない」指標になり、本当に傾いたときに
#   警告として機能しない。外向きは在庫ではなく**踏んだその場で issue に落とす**
#   運用に変えた。
#
# BACKLOG_CAP: open issue の警戒水位。**ゲートではなく煙探知機**。超過しても
#   作業は止めない。超過は「/pr の起票ゲート (実害 1 文 + 目的接続 1 文 +
#   Tier3 は記録しない) が機能していない」というサインとして読む。
#   20 は 2026-07-27 の棚卸し直後の open が 7 件だったことに対する余裕水位。
BACKLOG_CAP=20
