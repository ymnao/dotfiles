# 人の確認が要る変更の条件 (claude/skills/pr/scripts/merge-gate.sh が読むオプトインファイル)
# 書式: REQUIRE_REVIEW_PATH=<ERE> の 1 行ずつ。# 始まりはコメント。大文字小文字は区別しない。
#   未知の行と不正な ERE は判定を止める。読むのは base ブランチの版で、このファイル自身の変更は常に要確認。
#
# ここに書くのは classify-risk.sh が tier=high にしないものだけ。
# hook・settings*.json・.github/workflows・.github/scripts・Brewfile は tier=high で要確認になる。

# ホーム配下を書き換える配置・導入のスクリプト
REQUIRE_REVIEW_PATH=^scripts/(link|install)\.(sh|ps1)$

# 供給網の設定
REQUIRE_REVIEW_PATH=^pnpm/config\.yaml$
REQUIRE_REVIEW_PATH=^uv/uv\.toml$
REQUIRE_REVIEW_PATH=^npm/npmrc$

# merge 判定と review tier を決める側の変更は人が読む。
# script は PR の版が動くので、script 自身が判定を落とす変更をここで止められるとは限らない
REQUIRE_REVIEW_PATH=^(claude|codex)/skills/pr/
