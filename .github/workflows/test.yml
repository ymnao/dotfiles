# dotfiles の検証 CI。配置先: .github/workflows/test.yml
#
# トリガーは push (全ブランチ)。PR イベントを重ねると同一コミットに 2 回走るため
# 使わない。verify-ci-before-pr hook は「HEAD コミットの CI 状態」を見るので、
# PR 作成前の push で走るこの形が必須。
name: test

on:
  push:

# 同一ブランチへの連続 push で古い run を打ち切り、Actions 分数を節約する。
# main は cancel-in-progress: false にして完走させる (verify-ci-before-pr hook が
# main の CI 結果を参照するため、途中打ち切りで状態が曖昧になるのを避ける)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ロケール軸再発防止 (issue #181): make test を LC_ALL=C / en_US.UTF-8 /
  # ja_JP.UTF-8 の 3 ロケールで並列に回す。BSD/GNU awk の strcoll() 依存や
  # UTF-8 ロケール依存のバグ (past incident: agents-md-sync の日本語文字列
  # 誤 equal) を CI で常時検出するため。
  #
  # ロケール選定の根拠:
  #   - C: strcoll がバイト同一比較になる基準ケース、UTF-8 系との対比軸
  #   - en_US.UTF-8: past incident (A) が実際に発火したロケール、多くの
  #     macOS/Linux デフォルト
  #   - ja_JP.UTF-8: 日本語運用環境 (repo の主対象) の実挙動を再現。en_US
  #     とは照合順序が異なる (漢字の順序等) ため、UTF-8 系で別クラスの
  #     collation 差を拾える保険
  #
  # bash 版数軸 (macOS runner / bash 3.2) は Linux runner の ~10 倍分数を
  # 消費するため本 job には含めず、別 issue で単独評価する (issue #181 参照)。
  # bash 3.2 固有のクラス (past incident B) は CI では原理的に検出できない。
  # 開発者が macOS 手元で `make test` / `make test-locale-matrix` を実行した
  # 時に限り検出される (常時強制されていない点に注意)。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        locale: [C, en_US.UTF-8, ja_JP.UTF-8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ubuntu-latest は C / en_US.UTF-8 を含むが ja_JP.UTF-8 は無いため生成する。
      # C は組み込みで locale-gen の対象外なので条件でスキップし、runner イメージ
      # 更新で locale-gen C が warning/エラーを返し始めた際に C 側だけ落ちる事故を
      # 避ける。生成失敗 (runner イメージ変更等) は fail-fast したいので || true
      # しない。update-locale は job env で LC_ALL/LANG を渡す設計と併用したとき
      # 事実上 no-op なので付けない (紛らわしいだけ)。
      - name: Ensure locale ${{ matrix.locale }} is available
        if: matrix.locale != 'C'
        run: sudo locale-gen "${{ matrix.locale }}"

      # shellcheck は固定バージョンのバイナリを SHA256 検証付きで入れる
      # (issue #196)。apt をやめた理由・bump 手順・jq を pin しない理由は
      # .github/scripts/install-shellcheck.sh 冒頭のコメントに集約してある
      # (バージョンと SHA256 の正本もそこ 1 箇所)。
      # 開発機は Brewfile 経由 (Homebrew) で入れるため install 経路が dev↔CI で
      # 分岐している点は従来どおり意図的だが、shellcheck のバージョンは
      # この pin により CI 側が予測可能になる。
      #
      # matrix (locale 3 通り) で tarball を 3 回取得するが、linux.x86_64 は
      # 2.4MiB (2026-07-28 実測) で数秒のためキャッシュは入れない
      # (キー設計という抽象を増やす価値が無い)。削除した apt-get update の方が
      # 重いので wall-clock はむしろ改善する。
      #
      # LC_ALL/LANG は step-level env で make test 系にのみ渡す (下記 step 参照)。
      # 未生成のロケールを job-level env で先に立てると、locale-gen 前に走る
      # checkout / sudo が ambient LC_ALL=<未生成> でスタートし perl 等が
      # locale warning を吐いてログを汚す。
      - name: Install shellcheck (pinned)
        run: bash .github/scripts/install-shellcheck.sh

      # 前提が崩れたら fail させる (test-macos.yml の Verify environment と同じ
      # 方針)。ubuntu runner には shellcheck 0.9.0 が pre-install されており、
      # PATH 解決がそちらに倒れると「CI は green だが手元 (0.11.0) より緩い」
      # 偽 pass に戻る。バージョン番号も設置先 path も workflow 側には転記せず、
      # インストーラが GITHUB_ENV に書いた SHELLCHECK_BIN / SHELLCHECK_VERSION と
      # 突き合わせる (正本を 1 箇所に保つ。:? で未設定自体も fail させる)。
      # path とバージョンの両方を見るのは、path 一致だけでは「その場所にある
      # 実体が pin 版か」までは保証できないため。
      # jq は pin せず runner pre-install を使うため、存在確認をここで明示する
      # (pre-install が消えたら make test の前にこの step で落ちる)。
      - name: Verify shellcheck and jq
        run: |
          resolved="$(command -v shellcheck)"
          echo "resolved shellcheck: $resolved"
          shellcheck --version
          if [ "$resolved" != "${SHELLCHECK_BIN:?not set by install-shellcheck.sh}" ]; then
            echo "ERROR: shellcheck resolves to $resolved, not the pinned $SHELLCHECK_BIN" >&2
            exit 1
          fi
          : "${SHELLCHECK_VERSION:?not set by install-shellcheck.sh}"
          if ! shellcheck --version | grep -Fqx "version: ${SHELLCHECK_VERSION#v}"; then
            echo "ERROR: shellcheck is not ${SHELLCHECK_VERSION}" >&2
            exit 1
          fi
          command -v jq
          jq --version

      # bash 版数とロケールを毎 job のログに残す (issue #181 の再発防止観点)。
      # 何かで CI が誤 pass したときの切り分けのため、環境情報は必ず記録する。
      - name: Show bash version and locale
        env:
          LC_ALL: ${{ matrix.locale }}
          LANG: ${{ matrix.locale }}
        run: |
          bash --version
          locale

      - name: make test
        env:
          LC_ALL: ${{ matrix.locale }}
          LANG: ${{ matrix.locale }}
        run: make test

  # lint は matrix で 3 回走らせる意味がないため単独 job に分離する
  # (locale 非依存の secretlint 実行)。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: make lint
        run: make lint
