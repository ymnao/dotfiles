# Codex CLI configuration
#
# このファイルは scripts/codex-merge-config.sh によって ~/.codex/config.toml に
# ベース設定として書き出される。
# Codex CLI が動的に書き込む [projects.*] / [plugins.*] / [notice.*] /
# [tui.*] / [hooks.state] は dest 側で保護されるため、ここには含めない。
#
# notify もここには含めない (issue #283):
#   - 値がマシン固有の絶対パス (通知バイナリの実体) になるため、
#     「新しいマシンで同じ環境を再現する」というこの repo の目的と矛盾する
#   - notify は turn 終了ごとに host 側でコマンドを起動する実行ベクタで、
#     共有ベース設定で恒常化するのは防御層の設計意図に逆行する
#     (脅威モデルは docs/ai-operations.md §10。ここには複製しない)
# なお **手元で任意の notify を足すことも成立しない**。
# tests/integrity/run-integrity-check.sh は base に無いトップレベルの非テーブルキーを
# 許可リスト (tests/integrity/codex-config-subset.py の ALLOWED_EXTRA) の値に限る。
# 通るのは codex の Computer Use が自分で書き込む notify だけで、それ以外は
# `make gate` が毎ターン失敗し続ける。ファイル末尾に足すと TOML 仕様上
# [shell_environment_policy] 配下のキーになり (tomllib で実測: トップレベルの
# notify は未定義のまま)、トップレベル設定である notify としては解釈されない。
# パースエラーにはならないので気付きにくい。
# マシン固有 notify を使う必要が出たら、この非対称 (dest 側で保護されるのは
# セクションだけでトップレベルキーは対象外) を merge スクリプト側で扱うか
# どうかを別途決める。

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
allow_login_shell = false

[shell_environment_policy]
inherit = "all"
include_only = [
    "PATH",
    "HOME",
    "USER",
    "LANG",
    "SHELL",
    "TERM",
]
