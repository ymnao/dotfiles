# Codex CLI configuration
#
# このファイルは scripts/codex-merge-config.sh によって ~/.codex/config.toml に
# ベース設定として書き出される。
# Codex CLI が動的に書き込む [projects.*] / [plugins.*] / [notice.*] /
# [tui.*] / [hooks.state] は dest 側で保護されるため、ここには含めない。
#
# notify もここには含めない (issue #283):
#   - 値がマシン固有の絶対パス (通知バイナリの実体) になるため、
#     「新しいマシンで同じ環境を再現する」というこの repo の目的と矛盾する
#   - notify は turn 終了ごとに host 側でコマンドを起動する実行ベクタで、
#     共有ベース設定で恒常化するのは防御層の設計意図に逆行する
#     (脅威モデルは docs/ai-operations.md §10。ここには複製しない)
# なお **手元で任意の notify を足すことも成立しない**。
# tests/integrity/run-integrity-check.sh は base に無いトップレベルの非テーブルキーを
# 許可リスト (tests/integrity/codex-config-subset.py の ALLOWED_EXTRA) の値に限る。
# 通るのは codex の Computer Use が自分で書き込む notify だけで、それ以外は
# `make gate` が毎ターン失敗し続ける。ファイル末尾に足すと TOML 仕様上
# 直前のテーブル配下のキーになり (tomllib で実測: トップレベルの notify は
# 未定義のまま)、トップレベル設定である notify としては解釈されない。
# マシン固有 notify を使う必要が出たら、この非対称 (dest 側で保護されるのは
# セクションだけでトップレベルキーは対象外) を merge スクリプト側で扱うか
# どうかを別途決める。

model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
allow_login_shell = false
# sandbox_mode ではなく permission profile で書くのは、workspace root 配下の特定名だけを
# 書き込み禁止にする手段が profile にしか無いため (issue #375)。公式 docs の config
# reference は sandbox_mode / [sandbox_workspace_write] との併用を禁じている (2026-09-26 に
# WebFetch の要約で確認。codex 本体が併用を弾くかは未確認)。
default_permissions = "guarded"

[shell_environment_policy]
inherit = "all"
include_only = [
    "PATH",
    "HOME",
    "USER",
    "LANG",
    "SHELL",
    "TERM",
]

# MCP の起動に使うファイル (issue #372) を codex の Bash / sandbox 経路から守る。
# hook はコマンド文字列しか見ないので `p=.env; printf x > "$p"` を止められない。
# read ではなく deny (読み込みも拒否) なのは、glob は deny しか受け付けないため
# (codex-cli 0.157.1 で実測: "glob path only supports deny access")。完全一致の read は
# 直下にしか効かず sub/.env を素通りさせた。
[permissions.guarded]
extends = ":workspace"

[permissions.guarded.filesystem]
# workspace 外は :workspace が既に書き込みを拒否するが、$HOME で起動すると
# home 全体が workspace root になるため、user スコープの MCP 定義を明示的に read にする。
"~/.claude.json" = "read"

[permissions.guarded.filesystem.":workspace_roots"]
"." = "write"
"**/.env" = "deny"
"**/.mcp.json" = "deny"
"**/.mcp" = "deny"
# `**/.mcp` は名前そのもの (mkdir) にしか効かず、既存の .mcp/ 配下のファイルへの追記は
# 通った (2026-09-27 実測)。
"**/.mcp/**" = "deny"
