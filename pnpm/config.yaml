# pnpm の global 設定（供給網の防御）。project の pnpm-workspace.yaml の値が優先される。
# ~/.npmrc に置かないのは、pnpm が registry・認証以外の設定を YAML からだけ読むため
# （2026-10-25、pnpm 12.15.0 で project の .npmrc と pnpm-workspace.yaml に同じ値を置いて
# config get を比べて確認）。

# 既定値も 1440 だが、明示すると minimumReleaseAgeStrict が true になり、条件を満たす版が
# 無いときに古い版へ黙って戻さずエラーで止まる。急ぐ版は project 側の minimumReleaseAgeExclude で外す
minimumReleaseAge: 1440

trustPolicy: no-downgrade

# 書かないもの: blockExoticSubdeps / allowBuilds は global に置いても読まれない（同上の確認）が、
# 既定が安全側（true / 載っていない依存の build は不許可）。ignoreScripts は project 自身の
# lifecycle script と許可済みの build まで止め、esbuild などに頼る project を壊す
